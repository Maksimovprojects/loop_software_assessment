[pytest]
addopts =
    --browser chromium
    --headed
    --slowmo 300
    --html=reports/report.html
    --self-contained-html
    -v

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S

log_level = WARNING

testpaths = tests

markers =
    smoke: Quick sanity checks
    regression: Full regression suite